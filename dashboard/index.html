<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>群日常分析控制台</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      /* 等宽字体类 */
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
      }
    </style>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var themeVal = params.get("theme");
          var isDark = false;
          if (themeVal === "dark" || params.get("isDark") === "true") {
            isDark = true;
          } else if (themeVal === "light" || params.get("isDark") === "false") {
            isDark = false;
          } else if (localStorage.getItem("astrbot_plugin_theme_is_dark") === "true") {
            isDark = true;
          }
          if (isDark) {
            document.documentElement.style.background = "#000000";
            document.documentElement.style.color = "#ffffff";
          } else {
            document.documentElement.style.background = "#f5f5f5";
            document.documentElement.style.color = "#000000";
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
