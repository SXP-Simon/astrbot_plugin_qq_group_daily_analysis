name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff Check & Format
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Install Dependencies for Pyright
        run: |
          uv venv .venv
          uv pip install astrbot httpx aiohttp diskcache ulid-py python-telegram-bot qq-botpy

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pyright Type Check
        run: npx pyright

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "dashboard/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./dashboard
        run: pnpm install --frozen-lockfile

      - name: ESLint Check
        working-directory: ./dashboard
        run: pnpm lint

      - name: TypeScript Typecheck
        working-directory: ./dashboard
        run: pnpm typecheck

      - name: Build Single Bundle
        working-directory: ./dashboard
        run: pnpm build

      - name: Verify Bundle Outputs & Consistency
        run: |
          test -f pages/daily-analysis/index.html || exit 1
          test -f pages/daily-analysis/assets/index.js || exit 1
          if ! git diff --quiet pages/; then
            echo "::error::WebUI 源码已修改，但未在本地执行 'cd dashboard && pnpm build' 提交打包产物！"
            echo "请在本地运行 'cd dashboard && pnpm build'，并将更新后的 pages/ 目录一起提交。"
            git status --porcelain pages/
            git diff pages/
            exit 1
          fi
