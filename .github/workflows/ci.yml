name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
      skip_push_commit_lint: ${{ steps.merge_commit.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'main.py'
              - 'src/**'
              - 'tests/**'
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - '_conf_schema.json'
              - 'ruff.toml'
              - 'pyrightconfig.json'
            frontend:
              - 'dashboard/**'
              - 'pages/**'
              - 'openapi.json'
              - 'src/infrastructure/webui/**'
              - 'scripts/export_openapi.py'
            ci:
              - '.github/workflows/ci.yml'
              - 'scripts/verify-commit.js'
              - 'lefthook.yml'

      - name: Detect Conventional Commit with PR Number Suffix
        id: merge_commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
          const eventName = process.env.EVENT_NAME || '';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const commits = Array.isArray(event.commits) ? event.commits : [];
          const message = typeof event.head_commit?.message === 'string'
            ? event.head_commit.message
            : '';
          const subject = message.split(/\r?\n/, 1)[0].trim();
          const prNumberMatch = subject.match(/\s+\(#(\d+)\)$/);
          const conventionalSubject = subject.replace(/\s+\(#\d+\)$/, '');
          const hasConventionalHeader =
            /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\([^)]+\))?:\s+\S.*$/.test(
              conventionalSubject,
            );
          let isVerifiedSquashMerge = false;

          if (
            eventName === 'push' &&
            commits.length === 1 &&
            prNumberMatch &&
            hasConventionalHeader &&
            /^[0-9a-f]{40}$/i.test(event.after || '')
          ) {
            const [owner, repository] = process.env.GITHUB_REPOSITORY.split('/');
            const apiUrl =
              `https://api.github.com/repos/${owner}/${repository}/commits/${event.after}/pulls`;

            try {
              const response = await fetch(apiUrl, {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              });
              if (response.ok) {
                const pullRequests = await response.json();
                isVerifiedSquashMerge =
                  Array.isArray(pullRequests) &&
                  pullRequests.some((pullRequest) =>
                    pullRequest.number === Number(prNumberMatch[1]) &&
                    pullRequest.merged_at &&
                    pullRequest.merge_commit_sha?.toLowerCase() === event.after.toLowerCase(),
                  );
              } else {
                console.warn(
                  `Could not verify the associated PR (GitHub API returned ${response.status}); commit lint will run.`,
                );
              }
            } catch (error) {
              console.warn(`Could not verify the associated PR; commit lint will run: ${error}`);
            }
          }

          const skip = isVerifiedSquashMerge;

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          console.log(skip
            ? `Skipping push commit lint for PR merge subject: ${subject}`
            : `Commit lint will run for event '${eventName}'.`);
          })().catch((error) => {
            console.error(`Commit lint skip detection failed; CI will fail closed: ${error}`);
            process.exitCode = 1;
          });
          NODE

  commit-lint:
    name: Verify Commit Messages (STAR Standard)
    needs: detect-changes
    if: >-
      ${{ github.event_name != 'push' ||
          needs.detect-changes.outputs.skip_push_commit_lint != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Conventional Commit Messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::group::🔍 1. 校验 PR 标题与描述 (支持 Squash Merge 场景)"
            node scripts/verify-commit.js --pr
            echo "::endgroup::"

            echo "::group::🔍 2. 校验分支内原子 Commit (支持 Rebase / 普通 Merge 场景)"
            node scripts/verify-commit.js --range "origin/$BASE_REF...HEAD" || echo "::warning::分支历史提交中包含早期非原子或简写提交，PR 合并入主干时请使用 Squash and Merge。"
            echo "::endgroup::"
          else
            node scripts/verify-commit.js --ci
          fi

  python-lint:
    name: Python Lint, Type Check & Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.python == 'true' ||
      needs.detect-changes.outputs.ci == 'true'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff Check & Format
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Install Dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements-dev.txt

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pyright Type Check
        run: npx pyright

      - name: Run Pytest Suite
        run: |
          .venv/bin/pytest tests/


  frontend-check:
    name: Frontend Lint, Test & Build (with OpenAPI Contract Sync)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.frontend == 'true' ||
      needs.detect-changes.outputs.ci == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "dashboard/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./dashboard
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI Spec & Type Contract Consistency
        run: |
          uv run python scripts/export_openapi.py --check
          cd dashboard && pnpm generate:types
          if ! git diff --ignore-space-at-eol --quiet src/shared/api/generated/schema.d.ts; then
            echo "::error::OpenAPI 规范或前端类型存在未提交漂移！请在本地运行 'pnpm --dir dashboard generate:types' 并提交。"
            git diff src/shared/api/generated/schema.d.ts
            exit 1
          fi

      - name: Unit & Integration Tests (Vitest)
        working-directory: ./dashboard
        run: pnpm test

      - name: ESLint Check
        working-directory: ./dashboard
        run: pnpm lint

      - name: TypeScript Typecheck
        working-directory: ./dashboard
        run: pnpm typecheck

      - name: Build Single Bundle
        working-directory: ./dashboard
        run: pnpm build

      - name: Verify Bundle Outputs & Consistency
        run: |
          test -f pages/daily-analysis/index.html || exit 1
          test -f pages/daily-analysis/assets/index.js || exit 1
          if ! git diff --ignore-space-at-eol --quiet pages/; then
            echo "::error::WebUI 源码已修改，但未在本地执行 'cd dashboard && pnpm build' 提交打包产物！"
            echo "请在本地运行 'cd dashboard && pnpm build'，并将更新后的 pages/ 目录一起提交。"
            git status --porcelain pages/
            git diff --ignore-space-at-eol pages/
            exit 1
          fi

  ci-status:
    name: CI Completion Gate
    runs-on: ubuntu-latest
    needs: [detect-changes, commit-lint, python-lint, frontend-check]
    if: always()
    steps:
      - name: Evaluate CI Gate Results
        run: |
          echo "Evaluating CI Results..."
          echo "detect-changes: ${{ needs.detect-changes.result }}"
          echo "commit-lint: ${{ needs.commit-lint.result }}"
          echo "python-lint: ${{ needs.python-lint.result }}"
          echo "frontend-check: ${{ needs.frontend-check.result }}"

          if [ "${{ needs.detect-changes.result }}" = "failure" ] || [ "${{ needs.detect-changes.result }}" = "cancelled" ]; then
            echo "::error::detect-changes failed or was cancelled"
            exit 1
          fi

          if [ "${{ needs.commit-lint.result }}" = "failure" ] || [ "${{ needs.commit-lint.result }}" = "cancelled" ]; then
            echo "::error::commit-lint failed or was cancelled"
            exit 1
          fi

          if [ "${{ needs.commit-lint.result }}" = "skipped" ]; then
            echo "Commit message validation was safely skipped for a Conventional Commit with a PR number suffix on push."
          fi

          if [ "${{ needs.python-lint.result }}" = "failure" ] || [ "${{ needs.python-lint.result }}" = "cancelled" ]; then
            echo "::error::python-lint failed or was cancelled"
            exit 1
          fi

          if [ "${{ needs.frontend-check.result }}" = "failure" ] || [ "${{ needs.frontend-check.result }}" = "cancelled" ]; then
            echo "::error::frontend-check failed or was cancelled"
            exit 1
          fi

          echo "✅ All required checks passed or were safely skipped according to path filters!"

