name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  commit-lint:
    name: Verify Commit Messages (STAR Standard)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Conventional Commit Messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "::group::🔍 1. 校验 PR 标题与描述 (支持 Squash Merge 场景)"
            node scripts/verify-commit.js --pr-title "${{ github.event.pull_request.title }}" --pr-body "${{ github.event.pull_request.body }}"
            echo "::endgroup::"

            echo "::group::🔍 2. 校验分支内原子 Commit (支持 Rebase / 普通 Merge 场景)"
            node scripts/verify-commit.js --range "origin/${{ github.base_ref }}...HEAD" || echo "::warning::分支历史提交中包含早期非原子或简写提交，PR 合并入主干时请使用 Squash and Merge。"
            echo "::endgroup::"
          else
            node scripts/verify-commit.js --ci
          fi

  python-lint:
    name: Python Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff Check & Format
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Install Dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements-dev.txt

      - name: Set up Node.js for Pyright
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pyright Type Check
        run: npx pyright

      - name: Run Pytest Suite
        run: |
          .venv/bin/pytest tests/


  frontend-check:
    name: Frontend Lint, Test & Build (with OpenAPI Contract Sync)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "dashboard/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./dashboard
        run: pnpm install --frozen-lockfile

      - name: Verify OpenAPI Spec & Type Contract Consistency
        run: |
          uv run python scripts/export_openapi.py --check
          cd dashboard && pnpm generate:types
          if ! git diff --ignore-space-at-eol --quiet src/shared/api/generated/schema.d.ts; then
            echo "::error::OpenAPI 规范或前端类型存在未提交漂移！请在本地运行 'pnpm --dir dashboard generate:types' 并提交。"
            git diff src/shared/api/generated/schema.d.ts
            exit 1
          fi

      - name: Unit & Integration Tests (Vitest)
        working-directory: ./dashboard
        run: pnpm test

      - name: ESLint Check
        working-directory: ./dashboard
        run: pnpm lint

      - name: TypeScript Typecheck
        working-directory: ./dashboard
        run: pnpm typecheck

      - name: Build Single Bundle
        working-directory: ./dashboard
        run: pnpm build

      - name: Verify Bundle Outputs & Consistency
        run: |
          test -f pages/daily-analysis/index.html || exit 1
          test -f pages/daily-analysis/assets/index.js || exit 1
          if ! git diff --ignore-space-at-eol --quiet pages/; then
            echo "::error::WebUI 源码已修改，但未在本地执行 'cd dashboard && pnpm build' 提交打包产物！"
            echo "请在本地运行 'cd dashboard && pnpm build'，并将更新后的 pages/ 目录一起提交。"
            git status --porcelain pages/
            git diff --ignore-space-at-eol pages/
            exit 1
          fi
