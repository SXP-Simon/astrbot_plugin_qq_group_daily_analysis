name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]" pytest pytest-asyncio pytest-cov ruff

      - name: Ruff Check & Format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pytest Suite
        run: |
          uv run pytest tests/

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "dashboard/pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: ./dashboard
        run: pnpm install --frozen-lockfile

      - name: ESLint Check
        working-directory: ./dashboard
        run: pnpm lint

      - name: TypeScript Typecheck
        working-directory: ./dashboard
        run: pnpm typecheck

      - name: Build Single Bundle
        working-directory: ./dashboard
        run: pnpm build

      - name: Verify Bundle Outputs
        run: |
          test -f pages/daily-analysis/index.html || exit 1
          test -f pages/daily-analysis/assets/index.js || exit 1
