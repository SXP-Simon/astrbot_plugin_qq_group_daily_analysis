default_install_hook_types: [pre-commit, commit-msg, prepare-commit-msg]
ci:
  autofix_commit_msg: ":sparkles: auto fixes by pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: master
  autoupdate_schedule: weekly
  autoupdate_commit_msg: ":sparkles: pre-commit autoupdate"
repos:
- repo: local
  hooks:
    - id: ruff-check
      name: Ruff lint
      entry: uv run python scripts/check_python.py lint
      language: system
      types_or: [python, pyi]
      stages: [pre-commit]
    - id: ruff-format
      name: Ruff format check
      entry: uv run python scripts/check_python.py format --check
      language: system
      types_or: [python, pyi]
      stages: [pre-commit]
    - id: verify-commit
      name: Verify Conventional Commit & STAR 3-point message
      entry: node scripts/verify-commit.js
      language: system
      stages: [commit-msg]
