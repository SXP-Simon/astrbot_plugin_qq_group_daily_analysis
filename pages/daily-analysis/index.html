<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>群日常分析控制台</title>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      /* 增强移动端触摸交互响应性，防止点击延迟或被误当作手势吞噬 */
      button, a, input, select, textarea,
      .ant-btn, .ant-tabs-tab, .ant-select, .ant-select-selector, .ant-picker, .ant-tag, .ant-dropdown-trigger {
        touch-action: manipulation !important;
        cursor: pointer;
      }
      /* 等宽字体类 (现代无衬线等宽) */
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace !important;
      }
      /* 全局与代码块精致微型滚动条美化 (Light & Dark) */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.35);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.6);
      }
      pre::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      pre::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3);
        border-radius: 9999px;
      }
      pre::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.55);
      }
      /* 移动端 Tab 导航条支持平滑横向手势滑动，隐藏默认滚动条 */
      .ant-tabs-nav-wrap {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      .ant-tabs-nav-wrap::-webkit-scrollbar {
        display: none !important;
      }
    </style>
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var themeVal = params.get("theme");
          var isDark = false;
          if (themeVal === "dark" || params.get("isDark") === "true") {
            isDark = true;
          } else if (themeVal === "light" || params.get("isDark") === "false") {
            isDark = false;
          } else if (localStorage.getItem("astrbot_plugin_theme_is_dark") === "true") {
            isDark = true;
          }
          if (isDark) {
            document.documentElement.style.background = "#000000";
            document.documentElement.style.color = "#ffffff";
          } else {
            document.documentElement.style.background = "#f5f5f5";
            document.documentElement.style.color = "#000000";
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
