<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>群日常分析控制台</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var themeVal = params.get("theme");
          var isDark = false;
          if (themeVal === "dark" || params.get("isDark") === "true") {
            isDark = true;
          } else if (themeVal === "light" || params.get("isDark") === "false") {
            isDark = false;
          } else {
            try {
              if (
                typeof localStorage !== "undefined" &&
                localStorage.getItem("astrbot_plugin_theme_is_dark") === "true"
              ) {
                isDark = true;
              }
            } catch (_) {}
          }
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <script defer src="./assets/index.js"></script>
    <link rel="stylesheet" href="./assets/style.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
