# 日常提交只做快速、只读检查；完整验证由 CI 或下方手动任务执行。
pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.{py,pyi}"
      run: uv run python scripts/check_python.py format --check {staged_files}
    ruff-check:
      glob: "*.{py,pyi}"
      run: uv run python scripts/check_python.py lint {staged_files}
    webui-format:
      root: dashboard/
      glob: "dashboard/**.{ts,tsx,js,jsx,mjs,cjs,json,css,html,md,yml,yaml}"
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
    webui-lint:
      root: dashboard/
      glob: "dashboard/**.{ts,tsx,js,jsx,mjs,cjs}"
      run: pnpm exec oxlint --deny-warnings --report-unused-disable-directives --no-error-on-unmatched-pattern {staged_files}

commit-msg:
  commands:
    verify-commit:
      run: node scripts/verify-commit.js {1}

# 手动运行：lefthook run check-frontend，不安装为提交或推送钩子。
check-frontend:
  piped: true
  commands:
    lint:
      priority: 1
      run: pnpm --dir dashboard format:check && pnpm --dir dashboard lint
    typecheck:
      priority: 2
      run: pnpm --dir dashboard typecheck
    test:
      priority: 3
      run: pnpm --dir dashboard test
    build:
      priority: 4
      run: pnpm --dir dashboard build:no-typecheck

# 手动运行：lefthook run check-python。
check-python:
  piped: true
  commands:
    lint:
      priority: 1
      run: uv run python scripts/check_python.py lint . && uv run python scripts/check_python.py format --check .
    typecheck:
      priority: 2
      run: uv run python scripts/check_python.py typecheck
    test:
      priority: 3
      run: uv run pytest tests/

# 手动运行：lefthook run check-contract。类型生成会更新工作区，需审阅并提交。
check-contract:
  commands:
    contract:
      run: uv run python scripts/export_openapi.py --check && pnpm --dir dashboard generate:types && git diff --exit-code --ignore-space-at-eol -- dashboard/src/shared/api/generated/schema.d.ts
